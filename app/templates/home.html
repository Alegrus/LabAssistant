{% extends "base.html" %}
{% block title %}Lab Assistant{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[80vh]">
  <div class="w-full max-w-sm text-center space-y-4">
    <h1 class="text-2xl font-bold">Lab Assistant</h1>
    <p class="text-gray-500 text-sm">
      Welcome, <span class="font-medium text-gray-700">{{ principal.display_name or "Anonymous" }}</span>
    </p>
    <div class="bg-blue-50 border border-blue-200 rounded-lg px-6 py-8 text-blue-800">
      <p class="font-medium">Chat coming in Phase 3</p>
      <p class="text-sm mt-1 text-blue-600">You're successfully logged in.</p>
    </div>
    <form method="post" action="/logout">
      <button
        type="submit"
        class="text-sm text-gray-400 hover:text-gray-600 underline"
      >
        Sign out
      </button>
    </form>
  </div>
</div>
{% endblock %}
