{% extends "base.html" %}
{% block title %}Security — Admin{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="flex items-center gap-3">
    <a href="/admin" class="text-sm text-blue-600 hover:underline">← Dashboard</a>
    <h1 class="text-2xl font-bold">Security</h1>
  </div>

  {% if success %}
  <div class="px-4 py-3 rounded bg-green-100 text-green-800 text-sm">
    Passwords updated successfully.
  </div>
  {% endif %}

  {% if error %}
  <div class="px-4 py-3 rounded bg-red-100 text-red-800 text-sm">
    {{ error }}
  </div>
  {% endif %}

  <form method="post" action="/admin/security"
        class="bg-white shadow rounded-lg px-8 py-6 space-y-5">
    <div>
      <label for="current_admin_password" class="block text-sm font-medium text-gray-700 mb-1">
        Current admin password <span class="text-red-500">*</span>
      </label>
      <input id="current_admin_password" name="current_admin_password"
             type="password" required
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <hr class="border-gray-100">

    <div>
      <label for="new_user_password" class="block text-sm font-medium text-gray-700 mb-1">
        New user password <span class="text-gray-400 font-normal">(leave blank to keep current)</span>
      </label>
      <input id="new_user_password" name="new_user_password"
             type="password"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label for="new_admin_password" class="block text-sm font-medium text-gray-700 mb-1">
        New admin password <span class="text-gray-400 font-normal">(leave blank to keep current)</span>
      </label>
      <input id="new_admin_password" name="new_admin_password"
             type="password"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded text-sm transition-colors">
      Update passwords
    </button>
  </form>
</div>
{% endblock %}
